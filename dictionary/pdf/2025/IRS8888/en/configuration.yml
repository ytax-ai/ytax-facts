includeWhen: /form8888Attached   # taxCalculations:/form8888Attached is Form 1040 line 35a's own box, "If Form 8888 is attached, check here" — the printed statement that this return files the form, and the exact question a render gate asks. It is a PASS-THROUGH of form8888:/form8888SplitRefundElected (taxCalculations.xml:4085, a bare Dependency), so the two name ONE population and the choice between them is not a population choice: the taxCalculations fact is preferred because it is the 1040 line the attachment is declared on and it carries Export downstreamFacts="true". Complete-safe FALSE on every return that never answers the election (T1, 2026-09-02)
