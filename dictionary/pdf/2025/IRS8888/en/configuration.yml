      PgHeader[0]:
        CalendarYear[0]:
          f1_1[0]: /taxYear/~twoDigitYear   # header, p1: the "For calendar year 20__" suffix box (https://www.irs.gov/pub/irs-pdf/f8888.pdf, page 1). Form 8888 is a CONTINUOUS-USE form, so the filing year is typed rather than preprinted. constants:/taxYear ships (constants.xml:38, Int 2025) and already prints raw on IRS8862 yml:26 — but THIS box is the two-digit suffix only: the form preprints "20" at x521.9-531.0 and this widget is rect [532.8, 721.5, 550.4, 732.0], 17.6pt = two characters, so the raw Int would print "2025" into a two-character comb. Hence the ~twoDigitYear transform (transforms.tsv) rather than a second tax-year fact [authored T1, 2026-09-02]
