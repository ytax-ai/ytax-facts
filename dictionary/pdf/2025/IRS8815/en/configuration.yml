# IRS8815 — TY2025 printed-form field register (en).
#
# template: dictionary/pdf/2025/IRS8815/en/f8815.pdf
# vendored source: sources/f8815--ty2025--2025-12.pdf
# source sha256: 940b6af53a031f8456911774cd562c603420bae9030d73d226bbf56e40105844
# pages: 4   acroform fields: 39
#
# Generated by scripts/gen_pdf_configuration.py; hand-authored mappings are PRESERVED
# across re-emits and are keyed by the full dotted field path. A COMMENTED field is a
# declared gap, not an omission — it is a field this repo has not yet mapped to a fact.
# Uncommented values must resolve in dictionary/manifest/facts-manifest.json; --check
# proves that, and proves this directory's template still matches its vendored source.
includeWhen: /form8815ReturnFilesThisForm   # Form 8815 is filed when a positive qualified savings-bond interest exclusion is computed; restored 2026-09-20 after the page-1 mapping and golden landed.
# The gate was originally withdrawn because this register bound 0 of 39 fields. It is live again
# now that page 1 is mapped and the committed PDF fill golden covers the positive population.
#
# THAT CONDITION IS NOW CLEARED. 26 of 39 fields are bound: the whole of page 1, which is the
# only page of this form that is filed ("Attach to Form 1040 or 1040-SR.", f8815 line 7; page 2
# is "Intentionally Left Blank", f8815 line 47). Every line 1 row, every printed amount on lines
# 2 through 14, and both split decimal boxes on lines 7 and 12 resolve.
# The 13 remaining gaps are ALL on pages 3 and 4 and are ALL worksheet cells the printed form
# itself tells the filer to keep rather than file: "Line 6 Worksheet (keep a copy for your
# records)" (f8815 line 92) and "Line 9 Worksheet (keep a copy for your records)" (f8815 line
# 123). Their reasons are on each field below.
#
# The committed golden at tests/pdf-expected/en/IRS8815.yml is generated from the positive
# block15-render-gate-yes fixture. A separate single-filer regression can leave the exclusion
# Placeholder through formW2s:/secondaryFilerW2s; that remains a computation/input residue and
# correctly leaves this gate false rather than attaching a blank form.
form:
  topmostSubform[0]:
    Page1[0]:
      f1_1[0]: /primaryFiler/fullName   # header, p1: name(s) shown on return
      f1_2[0]: /primaryFiler/tin   # header, p1: your social security number
      Table_Line1[0]:
        Row1[0]:
          f1_3[0]: /form8815Students/[0]/writablePersonName   # line 1 row 1 column (a): name of person who was enrolled at or attended an eligible educational institution
          ColB[0]:
            f1_4[0]: /form8815Students/[0]/writableInstitutionName   # line 1 row 1 column (b): name of eligible educational institution
            f1_5[0]: /form8815Students/[0]/writableInstitutionAddress   # line 1 row 1 column (b): address of eligible educational institution
        Row2[0]:
          f1_6[0]: /form8815Students/[1]/writablePersonName   # line 1 row 2 column (a): name of person who was enrolled at or attended an eligible educational institution
          ColB[0]:
            f1_7[0]: /form8815Students/[1]/writableInstitutionName   # line 1 row 2 column (b): name of eligible educational institution
            f1_8[0]: /form8815Students/[1]/writableInstitutionAddress   # line 1 row 2 column (b): address of eligible educational institution
        Row3[0]:
          f1_9[0]: /form8815Students/[2]/writablePersonName   # line 1 row 3 column (a): name of person who was enrolled at or attended an eligible educational institution; a filer with a fourth attaches the statement f8815 line 21 calls for, which this register does not render
          ColB[0]:
            f1_10[0]: /form8815Students/[2]/writableInstitutionName   # line 1 row 3 column (b): name of eligible educational institution
            f1_11[0]: /form8815Students/[2]/writableInstitutionAddress   # line 1 row 3 column (b): address of eligible educational institution
      f1_12[0]: /form8815PrintLine2   # line 2: total qualified higher education expenses paid, reconstructed as line 4 plus line 3
      f1_13[0]: /form8815PrintLine3   # line 3: total nontaxable educational benefits received
      f1_14[0]: /form8815QualifiedHigherEducationExpensesNetOfEducationCredits   # line 4: line 2 less line 3, the expense figure the filer enters net of benefits and this dictionary reduces by the section 25A expenses line 2 also excludes
      f1_15[0]: /writableForm8815AggregateBondProceeds   # line 5: total proceeds from all series EE and I bonds issued after 1989 cashed this year
      f1_16[0]: /writableForm8815BondInterestIncluded   # line 6: the interest included on line 5
      f1_17[0]: /form8815Line7RatioThousandths/~integerPart   # line 7 whole part: floor(thousandths / 1000) of the applicable fraction
      f1_18[0]: /form8815Line7RatioThousandths/~thousandthsPart   # line 7 fractional box: zero-padded thousandths mod 1000 of the applicable fraction
      f1_19[0]: /form8815ExcludableSavingsBondInterestBeforeMagiPhaseout   # line 8: line 6 multiplied by line 7
      f1_20[0]: /form8815ModifiedAdjustedGrossIncome   # line 9: modified adjusted gross income
      f1_21[0]: /form8815PrintLine10   # line 10: 99,500 for single, head of household or qualifying surviving spouse, 149,250 for married filing jointly
      f1_22[0]: /form8815PrintLine11   # line 11: line 9 less line 10
      f1_23[0]: /form8815Line12PhaseoutThousandths/~integerPart   # line 12 whole part: floor(thousandths / 1000) of the phaseout fraction
      f1_24[0]: /form8815Line12PhaseoutThousandths/~thousandthsPart   # line 12 fractional box: zero-padded thousandths mod 1000 of the phaseout fraction
      f1_25[0]: /form8815MagiPhaseoutReduction   # line 13: line 8 multiplied by line 12
      f1_26[0]: /form8815ExcludableSavingsBondInterest   # line 14: line 8 less line 13, also Schedule B (Form 1040) line 3
