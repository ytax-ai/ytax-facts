# IRS8332 — TY2025 printed-form field register (en).
#
# template: dictionary/pdf/2025/IRS8332/en/f8332.pdf
# vendored source: sources/f8332--ty2025--2025-12.pdf
# source sha256: 527e99ce5812bfcb61cde80dcac3858f7dde5cfcbd74f894f6deb1a7472089f7
# pages: 2   acroform fields: 11
#
# Generated by scripts/gen_pdf_configuration.py; hand-authored mappings are PRESERVED
# across re-emits and are keyed by the full dotted field path. A COMMENTED field is a
# declared gap, not an omission — it is a field this repo has not yet mapped to a fact.
# Uncommented values must resolve in dictionary/manifest/facts-manifest.json; --check
# proves that, and proves this directory's template still matches its vendored source.
includeForEach: /form8332Children   # form8332.xml: "Attach a separate form for each child" (f8332:8) -- one copy per child, the UNION of the released (Parts I/II) and revoked (Part III) children. A Part I/II release is not an attachment to this return (f8332:70-77), but this package is the only place the custodial parent can obtain the copy to sign, so it prints here; only Part III is also attached to this return (f8332:65-72). S83(a)/(b), FED-8332-RENDER-GATE-015 + FED-8332-PER-CHILD-FORM-014
form:
  topmostSubform[0]:
    Page1[0]:
      f1_1[0]: /writableForm8332NoncustodialParentName   # https://www.irs.gov/pub/irs-pdf/f8332.pdf, page 1: Part I/II header, name of noncustodial parent. Return-level free text: the other parent is not a person this dictionary holds, so it repeats on every copy (follow-on row R1, per-child Part I/II writables)
      f1_2[0]: /writableForm8332NoncustodialParentTin   # https://www.irs.gov/pub/irs-pdf/f8332.pdf, page 1: Part I/II header, noncustodial parent's SSN. Return-level, same as f1_1
      f1_3[0]: /form8332Children/*/form8332PartIChildName   # https://www.irs.gov/pub/irs-pdf/f8332.pdf, page 1: Part I release, name of child. THIS child's own name when a filer releases the claim to this child for the current year; blank otherwise (FED-8332-PER-CHILD-FORM-014)
      f1_4[0]: /form8332PartICurrentTaxYearTwoDigit   # https://www.irs.gov/pub/irs-pdf/f8332.pdf, page 1: Part I, the two digit tax year. A TY2025 constant, so it prints on every copy including a revocation-only one (follow-on row R1)
      f1_5[0]: /form8332SigningFilerTin   # https://www.irs.gov/pub/irs-pdf/f8332.pdf, page 1: Part I signature line, custodial parent's SSN -- the SIGNING filer, not /primaryFiler unconditionally (S83(c), FED-8332-CUSTODIAL-SSN-FIELD-019)
      f1_6[0]: /form8332Children/*/form8332PartIIChildName   # https://www.irs.gov/pub/irs-pdf/f8332.pdf, page 1: Part II release for future years, name of child. THIS child's own name when its Part II years are answered; blank otherwise (FED-8332-PER-CHILD-FORM-014)
      f1_7[0]: /form8332Children/*/writableForm8332PartIIReleaseTaxYears   # https://www.irs.gov/pub/irs-pdf/f8332.pdf, page 1: Part II, tax year(s) released, per child (FED-8332-PER-CHILD-FORM-014)
      f1_8[0]: /form8332SigningFilerTin   # https://www.irs.gov/pub/irs-pdf/f8332.pdf, page 1: Part II signature line, custodial parent's SSN (S83(c))
      f1_9[0]: /form8332Children/*/form8332PartIIIChildName   # https://www.irs.gov/pub/irs-pdf/f8332.pdf, page 1: Part III revocation, name of child. THIS child's own name, drawn from the /familyAndHousehold collection the render population filters (S83(b)); blank on a release-only copy, because Part III there states a revocation nobody made
      f1_10[0]: /form8332Children/*/writableForm8332PartIIIRevocationTaxYears   # https://www.irs.gov/pub/irs-pdf/f8332.pdf, page 1: Part III, tax year(s) revoked, per child (S83(b)); unanswered and therefore blank on a release-only copy
      f1_11[0]: /form8332SigningFilerTin   # https://www.irs.gov/pub/irs-pdf/f8332.pdf, page 1: Part III signature line, custodial parent's SSN. Return-level (the same custodial parent signs every copy) -- see form8332.xml:/form8332SigningFilerTin
