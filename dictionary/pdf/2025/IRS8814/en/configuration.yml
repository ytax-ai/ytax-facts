includeForEach: /form8814Children   # f8814 header: one Form 8814 per child ("Attach to parents' Form 1040" with a single child name/SSN in boxes A and B, and line C "If more than one Form 8814 is attached, check here"). Every PER-CHILD dollar line (1a-4, 6, 9-12, 14, 15) is a /form8814Children/*/ path, so an includeWhen render would print one form with those boxes blank; only line 5's base amount and line C are return-level. taxCalculations:/form8814Included is the return-level "any 8814 at all" twin and would lose the per-child boxes (T1, 2026-09-02)
