      f1_5[0]: /form8615Line1   # line 1, p1: "1 Enter the child's unearned income. See instructions" (https://www.irs.gov/pub/irs-pdf/f8615.pdf, page 1). The fact's own Name is "Form 8615 line 1 (computed)" [authored 2026-09-19, unit IRS8615-REGISTER]
      # f1_6[0]:   # DECLARED GAP line 2, p1: "2 If the child did not itemize deductions on Schedule A (Form 1040) or Schedule A (Form 1040-NR), enter $2,700. Otherwise, see instructions" (https://www.irs.gov/pub/irs-pdf/f8615.pdf, page 1). NO FACT NAMES THIS LINE: the $2,700 is an inline Dollar literal inside /form8615Line3's Subtract (param form8615-unearned-income-threshold), not a fact of its own. Needs a named constant, form8615:/form8615Line2StandardAmount - the same shape as the shipping /form8814Line5BaseAmount, and the same gap IRS8814 f1_21[0] declares for its own preprinted line 13 amount. The itemizer alternative is fenced out by /writableForm8615ChildHasOnlyOrdinaryUnearnedIncome, so the constant is the whole line for the computed population. Fact-module change, outside this unit's fence [2026-09-19, unit IRS8615-REGISTER]
      f1_7[0]: /form8615Line3   # line 3, p1: "3 Subtract line 2 from line 1. If zero or less, stop; do not complete the rest of this form but do attach it to the child's return" (https://www.irs.gov/pub/irs-pdf/f8615.pdf, page 1). The fact's own Name is "Form 8615 line 3" [authored 2026-09-19, unit IRS8615-REGISTER]
