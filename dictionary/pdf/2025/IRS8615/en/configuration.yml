      f1_12[0]: /form8615Line8   # line 8, p1: "8 Add lines 5, 6, and 7. See instructions" (https://www.irs.gov/pub/irs-pdf/f8615.pdf, page 1). The fact's own Name is "Form 8615 line 8" [authored 2026-09-19, unit IRS8615-REGISTER]
