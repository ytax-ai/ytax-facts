      f1_9[0]: /form8615Line5   # line 5, p1: "5 Enter the smaller of line 3 or line 4. If zero, stop; do not complete the rest of this form but do attach it to the child's return" (https://www.irs.gov/pub/irs-pdf/f8615.pdf, page 1). The fact's own Name is "Form 8615 line 5 (child's net unearned income)" [authored 2026-09-19, unit IRS8615-REGISTER]
