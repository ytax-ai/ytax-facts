# IRS8615 — TY2025 printed-form field register (en).
#
# template: dictionary/pdf/2025/IRS8615/en/f8615.pdf
# vendored source: sources/f8615--ty2025--2025-09.pdf
# source sha256: f1a9ce61a62faa917fd9a565805de69bf132313a6070010dfd77cfb2ca3bcb57
# pages: 1   acroform fields: 32
#
# Generated by scripts/gen_pdf_configuration.py; hand-authored mappings are PRESERVED
# across re-emits and are keyed by the full dotted field path. A COMMENTED field is a
# declared gap, not an omission — it is a field this repo has not yet mapped to a fact.
# Uncommented values must resolve in dictionary/manifest/facts-manifest.json; --check
# proves that, and proves this directory's template still matches its vendored source.
includeWhen: /form8615ReturnFilesThisForm   # The render gate follows the module's Form 1040 line 16 filing-condition determination, with unresolved conditions excluded
# GATE RESTORED 2026-09-19 (unit IRS8615-REGISTER), with the matching dictionary/pdf/2025/gates.tsv row
# uncommented in the same commit (--check RENDER-GATE-DRIFT compares exactly these two artifacts). The
# withdrawal note this paragraph replaces read: the gate was live over a register that binds 0 of 32
# fields, so a return that tripped it would have attached a blank Form 8615 - block-4 ruling 4 verbatim,
# "a gate in front of an empty register prints a blank form". The EXT-BLOCK15 FIX pass (ruling 1) stated
# the restore condition in both artifacts: "once the register binds its Parts I-III child's-tax lines".
# It now does - 17 of 32 fields are mapped, including every Part I line that has a fact (1, 3, 5), every
# Part II line that has one (6, 7, 8, 9, 10, 11, 13) and every Part III line (14, 15, 16, 17, 18). The
# 15 remaining declared gaps are named below, each with its successor.
#
# TWO LIMITATIONS THIS GATE CARRIES, disclosed rather than fixed here (both need a fact-module change,
# outside this unit's fence):
#  (1) POPULATION MISMATCH. The gate follows /mustFileForm8615 (form8615.xml:23-37), but every printed
#      line below is computed only inside /form8615ComputableUnderOrdinaryLadder - the two attested
#      fences /writableForm8615ChildHasOnlyOrdinaryUnearnedIncome and
#      /writableForm8615NoSpecialRateWorksheetRequired. A child who must file Form 8615 but falls
#      outside that fence (an itemizer, a Form 2555 filer, a QDCGTW / Schedule D Tax Worksheet /
#      Schedule J population, or an unearned-income class the proxy omits) trips the gate with every
#      Part I-III line Incomplete, and prints a form with the header filled and the lines blank. That
#      is the same failure ruling 4 names, narrowed from "every return" to "every return outside the
#      fence"; the module's own /mustFileForm8615 BlockSubmissionOnTrue is what stops such a return
#      today. Successor: gate on the fenced population, or build the fenced-out computations.
#  (2) LINE 18 IS NOT CONSUMED. /form8615AllocableParentalTax is Exported but nothing reads it, so a
#      printed line 18 and the return's own Form 1040 line 16 disagree until line 18 is wired, which must happen together with a narrowing of
#      /mustFileForm8615's BlockSubmissionOnTrue population.
form:
  topmostSubform[0]:
    Page1[0]:
      f1_1[0]: /primaryFiler/fullName   # header, p1: printed caption "Child's name shown on return" (https://www.irs.gov/pub/irs-pdf/f8615.pdf, page 1). Form 8615 attaches to the CHILD's own Form 1040 or 1040-NR (line 7, "Attach only to the child's Form 1040 or 1040-NR"), so the child IS this return's filer - the single-person identity binding IRS8606, IRS4137 and IRS8919 already use for their own "name of the person who must file this form" captions, NOT the joint "name(s) shown on return" pair [authored 2026-09-19, unit IRS8615-REGISTER]
      f1_2[0]: /primaryFiler/tin   # header, p1: printed caption "Child's social security number" (https://www.irs.gov/pub/irs-pdf/f8615.pdf, page 1). Same reasoning as f1_1: the child is the filer of the return this form attaches to [authored 2026-09-19, unit IRS8615-REGISTER]
      f1_3[0]: /writableForm8615ParentName   # item A, p1: "A Parent's name (first, initial, and last). Caution: See instructions before completing." (https://www.irs.gov/pub/irs-pdf/f8615.pdf, page 1); the filer's entry of the parent i8615 Lines A-C names
      f1_4[0]: /writableForm8615ParentTin   # item B, p1: "B Parent's social security number" (https://www.irs.gov/pub/irs-pdf/f8615.pdf, page 1); the parent's SSN, never /primaryFiler/tin (that is the child's)
