      # c1_1[2]:   # DECLARED GAP item C, p1: "Married filing separately" (https://www.irs.gov/pub/irs-pdf/f8615.pdf, page 1; widget rect x216-224). Same blocker as c1_1[0] [2026-09-19, unit IRS8615-REGISTER]
