      f1_13[0]: /form8615Line9   # line 9, p1: "9 Enter the tax on the amount on line 8 based on the parent's filing status above. See instructions." (https://www.irs.gov/pub/irs-pdf/f8615.pdf, page 1). The fact's own Name is "Form 8615 line 9 (tentative tax on line 8, at the parent's rate)" [authored 2026-09-19, unit IRS8615-REGISTER]
