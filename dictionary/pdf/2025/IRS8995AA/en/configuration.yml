includeWhen: /qbi8995aScheduleARequired   # qbi.xml, new 2026-09-12: All(/qbiUsesForm8995A, /isInQbiPhaseInRange, /qbiHasSstbBusiness). https://www.irs.gov/pub/irs-pdf/i8995a.pdf, page 2 "Exception 2: If your 2025 taxable income before the QBI deduction is more than $394,600 but not more than $494,600 if married filing jointly, $197,300 and $247,300 for all other returns, an applicable percentage of your SSTB is treated as a qualified trade or business, you must complete Schedule A (Form 8995-A)." ABOVE the upper threshold an SSTB is not a qualified trade or business at all and Schedule A has nothing to apportion. /qbiHasSstbBusiness is new alongside, in the /qbiHasPatronBusiness shape (Count over /qualifiedBusinesses/*/isSstb inside an IsComplete arm, so a return with no collection is Complete FALSE). The /qbiUsesForm8995A conjunct is load-bearing on all four schedule gates: every 8995-A schedule attaches to Form 8995-A and to nothing else.
