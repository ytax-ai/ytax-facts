includeWhen: /form5695IsRequired   # form5695.xml, new 2026-09-12: BOTH PARTS. https://www.irs.gov/pub/irs-pdf/i5695.pdf, page 1 "Purpose of Form. Use Form 5695 to figure and take your residential energy credits" -- one form, two credits (Part I residential clean energy, Schedule 3 line 5a; Part II energy efficient home improvement, Schedule 3 line 5b), so a Part-I-only gate would drop every Part-II-only return. Part I reuses /residentialCleanEnergyPartIIsActive UNWIDENED (its other consumer, ctcOdc:/isCompletingCreditLimitWorksheetB, reads Credit Limit Worksheet A line 3 bullet c, which names Form 5695 PART I). Part II is the eight existing line-level Answered roll-ups plus IsComplete on the four Part II cost lines that have none (insulation, home energy audit, most expensive exterior door, enabling property). An INPUT test, not a value test: a Part II claim zeroed by the section 25C annual limits still files the form. Complete-safe throughout.
