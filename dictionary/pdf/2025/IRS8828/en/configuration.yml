includeWhen: /form8828RecaptureQuestionReached   # form8828.xml: the return is in Form 8828's own filing population (federal subsidy claimed, testing date not pre-1991) -- deliberately narrower than /form8828SubjectToRecaptureTax, since a $0 recapture tax under one of the four statutory exceptions does not excuse filing the form ("If this percentage is zero, you will have no recapture, but you still must complete and file Form 8828," i8828 line 20 instructions)
