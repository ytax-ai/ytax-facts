# IRS8283 — TY2025 printed-form field register (en).
#
# template: dictionary/pdf/2025/IRS8283/en/f8283.pdf
# vendored source: sources/f8283--ty2025--2025-12.pdf
# source sha256: 389ab1b7c01b542724092f82a55dd43ab00792770b5254a87c4cd4082d8d4c69
# pages: 2   acroform fields: 117
#
# Generated by scripts/gen_pdf_configuration.py; hand-authored mappings are PRESERVED
# across re-emits and are keyed by the full dotted field path. A COMMENTED field is a
# declared gap, not an omission — it is a field this repo has not yet mapped to a fact.
# Uncommented values must resolve in dictionary/manifest/facts-manifest.json; --check
# proves that, and proves this directory's template still matches its vendored source.
includeForEach: /form8283ItemsToPrint   # One Form 8283 copy per contribution item the form requires
#
# THE SECTION A / SECTION B SWITCH lives in the dictionary. /form8283Items/*/sectionForPrinting
# decides Section A or Section B from the printed instructions, and every printed cell of both
# sections reads its own section-gated projection, so one copy per item fills the cells of that
# item's section and leaves the other section's cells blank. 62 of 117 fields are bound: the page-1
# header identity block, Section A line 1 row A columns (a) through (i), all thirteen Section B
# Part I line 2 property-type boxes plus the NPS number, Section B Part I line 3 row A columns
# (a) through (h), the page-2 header identity pair, the whole of Section B Part IV (the appraiser
# name, title, business address over its two printed boxes, and identifying number), the whole
# of Section B Part V (the date of receipt, both sides of the unrelated-use Yes/No pair, the donee
# name, its EIN, its address over its two printed boxes, and the authorized signer's title),
# Section B Part II line 4c (the prior-year donee name and address, split the same way the
# appraiser/donee blocks are), all three Part II Yes/No restriction pairs (both sides), and
# Part III's identifying-letter-plus-description taxpayer statement.
#
# PAGE-2 GEOMETRY. Every f2_*/c2_* row below is assigned from the template's own AcroForm
# rectangles (pypdf /Rect against the caption baselines): the assignment is unambiguous and
# order-preserving top-to-bottom, and all 31 page-2 fields are accounted for. The six signature
# and date captions (the Part III donor, the Part IV appraiser and the Part V authorized signer)
# have no fillable field on this template. Each row below names its own printed cell, its
# rectangle, and the f8283 line that governs it.
#
# THE RENDER GATE. The includeForEach line above and the dictionary/pdf/2025/gates.tsv IRS8283 row
# both carry /form8283ItemsToPrint; gen_pdf_configuration.py --check RENDER-GATE-DRIFT compares
# them. The tracked golden tests/pdf-expected/en/IRS8283.yml is emitted from a materialized corpus
# (scripts/pdf_fill_check.py --emit-golden --current <dir> --form IRS8283).
#
# GAPS ON THE PRINTED COPY, disclosed:
#   1. Section A rows B-D and Section B line 3 rows B-C are unreachable: the render grain is one
#      item per copy, which fills row A only. Packing several items of one section onto one copy
#      must keep every cell of a row on the same item.
#   2. Section B Part I line 3 column (i) and the amount claimed as a deduction are not modelled at
#      the grain the printed cells need; Part II line 4a/4b (the partial-interest statement,
#      f2_3-f2_5) and line 4d/4e (the tangible-property location and the other-possessor name plus
#      its overflow line, f2_9-f2_11) have no section-gated projection.
#   3. The six unfillable signature/date captions oblige an externally-signed or Form 8453 route
#      whatever this dictionary does.
# A copy whose row A is right is attached with these gaps disclosed, rather than no Form 8283 at all.
