includeWhen: /form3800ReturnFilesThisForm   # Form 3800 reports a modeled general business credit (current-year or carried forward), a passive credit carryforward, a positive net elective payment election, or a Schedule A transfer statement; bare-return collection presence is guarded
# RENDER GATE RESTORED (new-era form3800 seat; decision to land Forms 8881 and 8941 by
# building Form 3800). The register now prints the whole of Parts I and II for an individual:
# Part I lines 1-6, Part II Section A lines 7-17, Section B line 26 ($0: no Form 8844 credit is
# carried), Section C lines 27-37 and line 38; and every Part III row the dictionary computes,
# columns (d), (e) and (g): lines 1j, 1s, 1y, 1aa, 1dd, 1ee, 1zz, 2, 4h, 5 and 6 (column (c) EIN
# on 1y and 1aa, column (j) on line 6), plus the header name and identifying number, item A and
# item B. What still does NOT print is refused, not printed blank: form3800
# /knockoutForm3800RequiredButNotProduced refuses a return with a net elective payment amount
# (columns (h)-(j)), a passive or transferee credit (Form 8582-CR; Part III column (f), Part V), a
# transfer election statement, a carryforward to 2025 (Part IV), or a pass-through credit whose
# column (c) EIN is not asked. Section B lines 18-25, Part III column (a)/(b), Part IV, Part V
# beyond the transferee rows and Part VI stay declared gaps below, each on a refused population or
# blank by the form's own instruction. The matching dictionary/pdf/2025/gates.tsv row is live
# (gen_pdf_configuration.py --check RENDER-GATE-DRIFT compares the two) and the golden is
# tests/pdf-expected/en/IRS3800.yml. History of the withdrawal (2026-09-13 to 2026-09-28): the
# register bound 0, then 32, then 40 of 1921 fields while Parts I-II were incomplete, and the gate
# stayed withdrawn on the block-4 ruling 4 bar ("a gate in front of an empty register prints a
# blank form"); FILL-PRIORITY S571-S573.
